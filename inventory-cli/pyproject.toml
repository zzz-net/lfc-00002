[project]
name = "inventory-cli"
version = "0.1.0"
description = "Offline inventory counting merge CLI tool"
requires-python = ">=3.10"

[tool.poetry.dependencies]
python = "^3.10"
typer = ">=0.12.0,<1.0.0"
click = ">=8.0,<8.2"
rich = ">=13.0.0"
pydantic = "^2.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
inventory = "inventory_cli.cli:app"